<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #liveFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

<iframe
    id="liveFrame"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>

<script>
    const params = new URLSearchParams(window.location.search);

    const id = params.get("id");
    const pwd = params.get("pwd");
    const s = params.get("s");

    if (!id || !pwd || !s) {
        document.body.innerHTML = "参数错误";
    } else {
        const url =
            "https://live.stmpsk.cn/live/" +
            encodeURIComponent(id) + "/" +
            encodeURIComponent(pwd) + "/" +
            encodeURIComponent(s);

        console.log("iframe地址：", url);

        document.getElementById("liveFrame").src = url;
    }
</script>

</body>
</html>
