<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #liveFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <iframe
        id="liveFrame"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <script>
        /*
         * 当前地址格式：
         * /web/live/10038/ZSI6eO/sid/1786769054
         */

        const parts = window.location.pathname
            .split('/')
            .filter(Boolean);

        const liveIndex = parts.indexOf('live');

        if (
            liveIndex === -1 ||
            !parts[liveIndex + 1] ||
            !parts[liveIndex + 2] ||
            parts[liveIndex + 3] !== 'sid' ||
            !parts[liveIndex + 4]
        ) {
            document.body.innerHTML = '参数错误';
        } else {
            const id = parts[liveIndex + 1];
            const pwd = parts[liveIndex + 2];
            const sid = parts[liveIndex + 4];

            const targetUrl =
                'https://live.stmpsk.cn/live/' +
                encodeURIComponent(id) + '/' +
                encodeURIComponent(pwd) + '/sid/' +
                encodeURIComponent(sid);

            document.getElementById('liveFrame').src = targetUrl;
        }
    </script>
</body>
</html>
