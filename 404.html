<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

    <!-- 默认标题，收到直播页面消息后会自动替换 -->
    <title>直播</title>

    <!-- 普通页面描述 -->
    <meta
        id="pageDescription"
        name="description"
        content="点击进入直播间">

    <!-- 分享卡片信息 -->
    <meta
        id="shareTitle"
        property="og:title"
        content="直播">

    <meta
        id="shareDescription"
        property="og:description"
        content="点击进入直播间">

    <meta
        property="og:type"
        content="website">

    <meta
        id="shareImage"
        property="og:image"
        content="http://fxfx.stmpsk.cn/logo.png">

    <link
        id="shareImageLink"
        rel="image_src"
        href="http://fxfx.stmpsk.cn/logo.png">

    <!-- 兼容部分分享抓取方式 -->
    <meta
        id="itemTitle"
        itemprop="name"
        content="直播">

    <meta
        id="itemDescription"
        itemprop="description"
        content="点击进入直播间">

    <meta
        id="itemImage"
        itemprop="image"
        content="http://fxfx.stmpsk.cn/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #liveFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }

        #errorMessage {
            width: 100%;
            padding: 30px 15px;
            color: #333;
            background: #fff;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>

<body>

    <iframe
        id="liveFrame"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

    <script>
        (function () {
            var LIVE_ORIGIN = 'https://live.stmpsk.cn';
            var GITHUB_ORIGIN = 'https://qqwww1234.github.io';

            var DEFAULT_TITLE = '直播';
            var DEFAULT_DESCRIPTION = '点击进入直播间';
            var DEFAULT_IMAGE =
                'http://fxfx.stmpsk.cn/logo.png';

            var liveFrame =
                document.getElementById('liveFrame');

            /*
             * 更新 GitHub 外层页面的标题和分享信息
             */
            function updateShareInfo(title, description, image) {
                title = title || DEFAULT_TITLE;
                description =
                    description || DEFAULT_DESCRIPTION;
                image = image || DEFAULT_IMAGE;

                document.title = title;

                setMetaContent('shareTitle', title);
                setMetaContent(
                    'shareDescription',
                    description
                );
                setMetaContent('shareImage', image);

                setMetaContent('itemTitle', title);
                setMetaContent(
                    'itemDescription',
                    description
                );
                setMetaContent('itemImage', image);

                setMetaContent(
                    'pageDescription',
                    description
                );

                var imageLink =
                    document.getElementById(
                        'shareImageLink'
                    );

                if (imageLink) {
                    imageLink.setAttribute('href', image);
                }

                console.log('分享资料已更新：', {
                    title: title,
                    description: description,
                    image: image
                });
            }

            function setMetaContent(id, value) {
                var element =
                    document.getElementById(id);

                if (element) {
                    element.setAttribute(
                        'content',
                        value
                    );
                }
            }

            /*
             * 从微信授权回调参数读取登录资料，
             * 保存到 GitHub 域名的 localStorage
             */
            function saveLoginUserFromUrl() {
                var params =
                    new URLSearchParams(
                        window.location.search
                    );

                var openid =
                    params.get('openid') || '';

                if (!openid) {
                    return;
                }

                var loginUser = {
                    openid: openid,

                    user_id:
                        params.get('user_id') || '',

                    user_nickname:
                        params.get('user_nickname') || '',

                    user_touxiang:
                        params.get('user_touxiang') || ''
                };

                try {
                    localStorage.setItem(
                        'wechat_login_user',
                        JSON.stringify(loginUser)
                    );
                } catch (error) {
                    console.log(
                        '保存登录资料失败：',
                        error
                    );
                }

                /*
                 * 从地址栏删除用户资料，
                 * 避免分享时把用户资料一起分享出去
                 */
                params.delete('openid');
                params.delete('user_id');
                params.delete('user_nickname');
                params.delete('user_touxiang');
                params.delete('id');
                params.delete('pwd');

                var cleanUrl =
                    window.location.pathname;

                var remainingQuery =
                    params.toString();

                if (remainingQuery) {
                    cleanUrl += '?' + remainingQuery;
                }

                cleanUrl += window.location.hash;

                window.history.replaceState(
                    null,
                    '',
                    cleanUrl
                );
            }

            /*
             * 读取已经保存的微信登录资料
             */
            function getLoginUser() {
                try {
                    var value =
                        localStorage.getItem(
                            'wechat_login_user'
                        );

                    if (!value) {
                        return {};
                    }

                    return JSON.parse(value);
                } catch (error) {
                    console.log(
                        '读取登录资料失败：',
                        error
                    );

                    return {};
                }
            }

            /*
             * 把登录资料发送给 live.stmpsk.cn
             */
            function sendLoginUserToLive() {
                if (
                    !liveFrame ||
                    !liveFrame.contentWindow
                ) {
                    return;
                }

                liveFrame.contentWindow.postMessage(
                    {
                        type: 'login-user',
                        user: getLoginUser()
                    },
                    LIVE_ORIGIN
                );
            }

            /*
             * 监听 iframe 发来的消息
             */
            window.addEventListener(
                'message',
                function (event) {
                    if (event.origin !== LIVE_ORIGIN) {
                        return;
                    }

                    var data = event.data || {};

                    /*
                     * 直播页面主动索取登录资料
                     */
                    if (
                        data.type ===
                        'request-login-user'
                    ) {
                        sendLoginUserToLive();
                        return;
                    }

                    /*
                     * 直播页面发来直播标题
                     */
                    if (
                        data.type ===
                        'live-share-info'
                    ) {
                        updateShareInfo(
                            data.title,
                            data.description,
                            data.image
                        );
                        return;
                    }

                    /*
                     * 直播 iframe 请求微信授权登录。
                     * 必须由 GitHub 外层页面进行顶层跳转。
                     */
                    if (
                        data.type ===
                        'wechat-login' &&
                        data.url
                    ) {
                        var loginUrl =
                            String(data.url);

                        /*
                         * 只允许跳转微信官方授权地址
                         */
                        if (
                            loginUrl.indexOf(
                                'https://open.weixin.qq.com/'
                            ) === 0
                        ) {
                            window.location.href =
                                loginUrl;
                        }

                        return;
                    }
                }
            );

            /*
             * 保存微信授权回调资料
             */
            saveLoginUserFromUrl();

            /*
             * 解析当前 GitHub 地址：
             *
             * /web/live/10038/ZSI6eO/sid/1786769054
             */
            var parts =
                window.location.pathname
                    .split('/')
                    .filter(function (item) {
                        return item !== '';
                    });

            var liveIndex =
                parts.indexOf('live');

            if (
                liveIndex === -1 ||
                !parts[liveIndex + 1] ||
                !parts[liveIndex + 2] ||
                parts[liveIndex + 3] !== 'sid' ||
                !parts[liveIndex + 4]
            ) {
                document.body.innerHTML =
                    '<div id="errorMessage">' +
                    '参数错误' +
                    '</div>';

                return;
            }

            var id =
                parts[liveIndex + 1];

            var pwd =
                parts[liveIndex + 2];

            var sid =
                parts[liveIndex + 4];

            var targetUrl =
                LIVE_ORIGIN +
                '/live/' +
                encodeURIComponent(id) +
                '/' +
                encodeURIComponent(pwd) +
                '/sid/' +
                encodeURIComponent(sid);

            /*
             * iframe 加载完成后：
             * 1. 发送微信登录资料
             * 2. 索取直播名称和分享信息
             */
            liveFrame.addEventListener(
                'load',
                function () {
                    sendLoginUserToLive();

                    liveFrame.contentWindow.postMessage(
                        {
                            type:
                                'request-live-share-info'
                        },
                        LIVE_ORIGIN
                    );
                }
            );

            /*
             * 必须最后设置 iframe 地址，
             * 确保消息监听已经准备完成
             */
            liveFrame.src = targetUrl;
        })();
    </script>

</body>
</html>
